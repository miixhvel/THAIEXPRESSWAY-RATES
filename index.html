<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>คำนวณค่าทางด่วน - Dark Mode</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Prompt',sans-serif;background:#09090b;color:#f8fafc;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}

  .app-container{width:100%;max-width:410px;height:100%;background:#121214;display:flex;flex-direction:column;position:relative;box-shadow:0 25px 50px rgba(0,0,0,.6);overflow:hidden}
  @media(min-width:410px){.app-container{height:92vh;border-radius:44px;border:10px solid #27272a}}

  .app-header{background:#18181b;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10;border-bottom:1px solid #27272a}
  .header-loc-title{font-size:.82rem;font-weight:600;color:#fff}
  .header-loc-sub{font-size:.65rem;color:#a1a1aa}
  .action-btn{width:36px;height:36px;border-radius:50%;background:#27272a;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:.9rem}

  .screen{flex:1;display:none;flex-direction:column;overflow-y:auto;padding:16px 20px 100px;position:relative;background:#121214}
  .screen.active{display:flex}

  .section-title{font-size:.85rem;font-weight:700;color:#fff;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  
  .card{background:#18181b;border-radius:24px;padding:16px;margin-bottom:14px;border:1px solid #27272a;box-shadow:0 8px 24px rgba(0,0,0,.3)}

  .select-group{margin-bottom:10px}
  .select-group label{display:block;font-size:.7rem;color:#a1a1aa;margin-bottom:4px;font-weight:600}
  .app-select{width:100%;padding:10px 14px;border-radius:14px;border:2px solid #3f3f46;background:#27272a;color:#fff;font-family:inherit;font-size:.78rem;outline:none;cursor:pointer;transition:.2s;font-weight:600}
  .app-select:focus{box-shadow:0 0 10px rgba(255,183,3,.25)}

  .btn-gold{background:linear-gradient(135deg,#ffb703,#fb8500);color:#000;border:none;width:100%;padding:14px;border-radius:24px;font-weight:700;font-size:.95rem;cursor:pointer;box-shadow:0 6px 20px rgba(251,133,0,.3);transition:.2s}
  .btn-gold:active{transform:scale(.98)}

  .swap-btn{background:#27272a;border:1px solid #3f3f46;color:#ffb703;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:4px auto;font-size:.9rem}

  .checkout-bar{position:absolute;bottom:80px;left:20px;right:20px;background:#18181b;color:#fff;border-radius:30px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);border:1px solid #3f3f46;z-index:20;cursor:pointer}
  .checkout-bar b{color:#ffb703;font-size:1.15rem}

  .floating-nav{position:absolute;bottom:16px;left:16px;right:16px;background:#18181b;border-radius:35px;padding:8px 16px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6);border:1px solid #27272a;z-index:30}
  .nav-item{background:none;border:none;color:#71717a;font-size:1.1rem;cursor:pointer;padding:8px 16px;border-radius:20px;display:flex;align-items:center;gap:6px;transition:.2s}
  .nav-item span{font-size:.7rem;display:none;color:#ffb703;font-weight:600}
  .nav-item.active{background:#27272a;color:#ffb703}
  .nav-item.active span{display:inline}

  .map-container{flex:1;width:100%;border-radius:24px;overflow:hidden;border:1px solid #27272a;position:relative;min-height:300px}
  #map{width:100%;height:100%;background:#121214}

  .map-info-card{position:absolute;top:14px;left:14px;right:14px;background:rgba(18,18,20,0.95);backdrop-filter:blur(10px);border:1px solid #3f3f46;padding:12px 16px;border-radius:18px;z-index:1000;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 25px rgba(0,0,0,.5)}
  .map-info-title{font-size:.78rem;font-weight:700;color:#fff}
  .map-info-sub{font-size:.65rem;color:#a1a1aa;margin-top:2px}
  .map-info-badge{background:linear-gradient(135deg,#ffb703,#fb8500);color:#000;padding:4px 10px;border-radius:12px;font-size:.72rem;font-weight:700}

  .map-controls{position:absolute;bottom:20px;right:14px;z-index:1000;display:flex;flex-direction:column;gap:8px}
  .map-ctrl-btn{background:rgba(24,24,27,0.95);border:1px solid #3f3f46;color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);font-size:.95rem;transition:.2s}
  .map-ctrl-btn:active{transform:scale(.92)}
  .map-ctrl-btn.active{background:#ffb703;color:#000;border-color:#ffb703}

  .map-plaza-label{background:rgba(24,24,27,0.95);border:1px solid #ffb703;color:#ffb703;padding:3px 8px;font-family:'Prompt',sans-serif;font-size:.68rem;font-weight:700;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
  .map-plaza-label::before{display:none}

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #18181b !important; color: #fff !important; border:1px solid #3f3f46; }
  .popup-btn-in { background: #16a34a; color: #fff; border: none; padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 0.75rem; cursor: pointer; flex: 1; }
  .popup-btn-out { background: #dc2626; color: #fff; border: none; padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 0.75rem; cursor: pointer; flex: 1; }
</style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffb703,#fb8500);color:#000;display:flex;align-items:center;justify-content:center;font-size:1.1rem;">🛣️</div>
      <div>
        <div class="header-loc-title" data-i18n="appTitle">ระบบคำนวณทางด่วน</div>
        <div class="header-loc-sub" data-i18n="appSub">📍 กรุงเทพฯ และปริมณฑล</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="action-btn" id="langBtn" onclick="toggleLanguage()" title="Change Language" style="font-size:.75rem;font-weight:700;background:#27272a;color:#ffb703;border:1px solid #3f3f46;">EN</button>
      <button class="action-btn" onclick="resetApp()" title="Reset">🔄</button>
    </div>
  </div>

  <!-- หน้าแรก (Tab 1): คำนวณ -->
  <div class="screen active" id="screen-calc">
    <div class="card">
      <div style="font-weight:600;font-size:.78rem;color:#fff;margin-bottom:6px;" data-i18n="vehicleType">🚗 ประเภทรถ</div>
      <div style="display:flex;gap:6px;" id="vehicles">
        <button data-c="0" class="cat-item active" style="flex:1;padding:6px;border:1px solid #ffb703;background:rgba(255,183,3,.15);color:#ffb703;font-weight:700;border-radius:12px;cursor:pointer;font-size:.75rem;" data-i18n="car4">4 ล้อ</button>
        <button data-c="1" class="cat-item" style="flex:1;padding:6px;border:1px solid #3f3f46;background:#27272a;color:#a1a1aa;font-weight:600;border-radius:12px;cursor:pointer;font-size:.75rem;" data-i18n="car6_10">6-10 ล้อ</button>
        <button data-c="2" class="cat-item" style="flex:1;padding:6px;border:1px solid #3f3f46;background:#27272a;color:#a1a1aa;font-weight:600;border-radius:12px;cursor:pointer;font-size:.75rem;" data-i18n="carOver10">> 10 ล้อ</button>
      </div>
    </div>

    <div class="card" style="border-left:5px solid #22c55e; background: linear-gradient(145deg, #18181b, #132217);">
      <div style="font-weight:700;font-size:.82rem;color:#22c55e;margin-bottom:10px; display:flex; align-items:center; gap:6px;">
        <span>🟢</span> <span data-i18n="inboundLabel">ขาเข้า (จุดเริ่มต้นเดินทาง)</span>
      </div>
      
      <div class="select-group">
        <label data-i18n="selectRoad">เลือกเส้นทางด่วน:</label>
        <select id="inRoadSelect" class="app-select" onchange="onRoadChange('in', this.value)">
          <option value="" data-i18n="selectRoadPlaceholder">-- กรุณาเลือกทางด่วน --</option>
        </select>
      </div>

      <div class="select-group" style="margin-bottom:0;">
        <label data-i18n="selectPlazaIn">เลือกด่านเริ่มต้น:</label>
        <select id="inPlazaSelect" class="app-select" onchange="onPlazaChange('in', this.value)">
          <option value="" data-i18n="selectRoadFirst">-- เลือกทางด่วนก่อน --</option>
        </select>
      </div>
    </div>

    <button class="swap-btn" onclick="swapRoute()" title="สลับต้นทาง-ปลายทาง">⇄</button>

    <div class="card" style="border-left:5px solid #dc2626; background: linear-gradient(145deg, #18181b, #251414);">
      <div style="font-weight:700;font-size:.82rem;color:#ef4444;margin-bottom:10px; display:flex; align-items:center; gap:6px;">
        <span>🔴</span> <span data-i18n="outboundLabel">ขาออก (จุดปลายทางสิ้นสุด)</span>
      </div>

      <div class="select-group">
        <label data-i18n="selectRoad">เลือกเส้นทางด่วน:</label>
        <select id="outRoadSelect" class="app-select" onchange="onRoadChange('out', this.value)">
          <option value="" data-i18n="selectRoadPlaceholder">-- กรุณาเลือกทางด่วน --</option>
        </select>
      </div>

      <div class="select-group" style="margin-bottom:0;">
        <label data-i18n="selectPlazaOut">เลือกด่านปลายทาง:</label>
        <select id="outPlazaSelect" class="app-select" onchange="onPlazaChange('out', this.value)">
          <option value="" data-i18n="selectRoadFirst">-- เลือกทางด่วนก่อน --</option>
        </select>
      </div>
    </div>
  </div>

  <!-- หน้าสอง (Tab 2): แผนที่ -->
  <div class="screen" id="screen-map">
    <div class="map-container">
      <div class="map-info-card" id="mapInfoCard">
        <div>
          <div class="map-info-title" id="mapInfoTitle" data-i18n="mapOverviewTitle">ภาพรวมโครงข่ายทางด่วน</div>
          <div class="map-info-sub" id="mapInfoSub" data-i18n="mapOverviewSub">คลิกเส้นทางเพื่อดูรายละเอียด</div>
        </div>
        <div class="map-info-badge" id="mapInfoBadge" data-i18n="mapBadgeAll">ทั้งหมด</div>
      </div>

      <div class="map-controls">
        <button class="map-ctrl-btn" id="trafficToggleBtn" onclick="toggleTrafficLayer()" title="Map Layer">🗺️</button>
        <button class="map-ctrl-btn" onclick="resetMapZoom()" title="Reset Zoom">🎯</button>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <!-- หน้าสุดท้าย (Tab 3): สรุปผล -->
  <div class="screen" id="screen-summary">
    <div class="section-title">
      <span data-i18n="totalSummary">สรุปยอดรวมสะสม</span>
    </div>
    
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;border:1px solid #ffb70333;margin-bottom:16px;">
      <div>
        <div style="font-size:.72rem;color:#a1a1aa;" data-i18n="totalFeeLabel">รวมค่าผ่านทางทั้งหมด</div>
        <div style="font-size:1.2rem;font-weight:700;color:#ffb703;" id="homeTotalDisplay">0 ฿</div>
      </div>
      <div style="font-size:1.8rem;">💰</div>
    </div>

    <div class="section-title">
      <span data-i18n="tripListLabel">รายการค่าผ่านทาง (เรียงตามลำดับ)</span>
      <button onclick="copySummary()" style="background:#27272a;border:1px solid #3f3f46;color:#ffb703;padding:3px 8px;border-radius:10px;font-size:.68rem;cursor:pointer;font-weight:600;" data-i18n="copyBtn">📋 คัดลอก</button>
    </div>
    
    <div id="homeTripsList">
      <div style="text-align:center;color:#71717a;padding:30px;font-size:.78rem;" data-i18n="noTrips">ยังไม่มีรายการเดินทาง</div>
    </div>
  </div>

  <div class="checkout-bar" id="checkoutBar" style="display:none;" onclick="addTripAndGo()">
    <div>
      <div style="font-size:.62rem;color:#a1a1aa;" id="barMeta" data-i18n="includeSection">รวมช่วงนี้</div>
      <b id="barFee">0 ฿</b>
    </div>
    <div style="background:linear-gradient(135deg,#ffb703,#fb8500);color:#000;padding:8px 16px;border-radius:18px;font-size:.78rem;font-weight:700;" data-i18n="searchRouteBtn">บันทึกทริปนี้ 🔍</div>
  </div>

  <nav class="floating-nav">
    <button class="nav-item active" onclick="switchTab('calc', this)">🛣️<span data-i18n="navCalc">คำนวณ</span></button>
    <button class="nav-item" id="navMap" onclick="switchTab('map', this)">🗺️<span data-i18n="navMap">แผนที่</span></button>
    <button class="nav-item" id="navSummary" onclick="switchTab('summary', this)">📋<span data-i18n="navSummary">สรุปผล</span></button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

    selectRoad: "Select Expressway:",
    selectRoadPlaceholder: "-- Select Expressway --",
    selectPlazaIn: "Select Entry Plaza:",
    selectPlazaOut: "Select Exit Plaza:",
    selectRoadFirst: "-- Select Expressway First --",
    mapOverviewTitle: "Expressway Network Overview",

    viewTripMap: "🗺️ View this trip on map"
  }

function toggleLanguage() {
  currentLang = currentLang === 'th' ? 'en' : 'th';
  $('langBtn').textContent = currentLang === 'th' ? 'EN' : 'TH';
  updateLanguageUI();
}

function updateLanguageUI() {
  const dict = i18n[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(dict[key]) el.textContent = dict[key];
  });
  populateDropdowns();
  updateHomeUI();
  drawMap(false);
}

const AFFILIATE_URL = "https://s.shopee.co.th/W7XuoEcjn";
function initAffiliateOnce() {
  if (!sessionStorage.getItem('shopee_opened')) {
    sessionStorage.setItem('shopee_opened', 'true');
    window.open(AFFILIATE_URL, '_blank');
  }
}

function switchTab(tabName, el){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  $('screen-' + tabName).classList.add('active');
  
  if(el && el.classList.contains('nav-item')) {
    el.classList.add('active');
  } else {
    document.querySelectorAll('.nav-item').forEach(n => {
      if(n.getAttribute('onclick')?.includes(tabName)) n.classList.add('active');
    });
  }

  if(tabName === 'map') {
    setTimeout(() => { map.invalidateSize(); drawMap(false); }, 150);
  } else if(tabName === 'calc') {
    focusedTripIndex = null;
  }
}

function resetMapZoom(){
  selectedRoadId = null;
  drawMap(true);
}

const up5 = x => Math.ceil(x / 5) * 5;
const byKm = (entry, rate, cap, rnd = up5) => (a, b, c, r) => {
  const km = Math.abs(r.plazas[b].km - r.plazas[a].km);
  return Math.min(cap[c], rnd(entry[c] + km * rate[c]));
};
const bySection = secs => (a, b, c) => {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  return secs.reduce((f, s) => f + (lo <= s[0] && hi >= s[1] ? s[2][c] : 0), 0);
};
const F = (a, b, c) => ({fee:[a, b, c]});

      {name:'พระราม 9 / Rama IX', ll:[13.7550,100.5680], ...F(50,75,110)},
      {name:'อโศก / Asok', ll:[13.7500,100.5610], ...F(50,75,110)},
      {name:'พระราม 4 / Rama IV', ll:[13.7200,100.5550], ...F(50,75,110)},
      {name:'พระราม 3 / Rama III', ll:[13.6950,100.5280], ...F(50,75,110)},

const key = (r, i) => r + ':' + i;
const getRoad = id => ROADS.find(r => r.id === id);
const G = {};
const kmBetween = (p, q) => Math.hypot((p[0]-q[0])*111, (p[1]-q[1])*111*Math.cos(p[0]*Math.PI/180));
function addEdge(u, v, w){ (G[u] = G[u] || []).push([v, w]); (G[v] = G[v] || []).push([u, w]); }
ROADS.forEach(r => {
  r.plazas.forEach((_, i) => G[key(r.id, i)] = G[key(r.id, i)] || []);
  (r.paths || [r.plazas.map((_, i) => i)]).forEach(p => p.forEach((v, k) => {
    if (k) addEdge(key(r.id, p[k-1]), key(r.id, v), kmBetween(r.plazas[p[k-1]].ll, r.plazas[v].ll));
  }));
});
LINKS.forEach(([r1,i1,r2,i2]) => addEdge(key(r1,i1), key(r2,i2), 0.5 + kmBetween(getRoad(r1).plazas[i1].ll, getRoad(r2).plazas[i2].ll)));

function findRoute(src, dst){
  const dist = {[src]:0}, prev = {}, done = new Set();
  while (true) {
    let u = null;
    for (const k in dist) if (!done.has(k) && (u === null || dist[k] < dist[u])) u = k;
    if (u === null || u === dst) break;
    done.add(u);
    G[u].forEach(([v, w]) => {
      if (dist[v] === undefined || dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
    });
  }
  if (dist[dst] === undefined) return null;
  const out = [];
  for (let v = dst; v !== undefined; v = prev[v]) out.unshift(v);
  return out.map(k => { const [road, i] = k.split(':'); return {road, i:+i}; });
}

let cls = 0;

function flatFee(r, i){
  if (r.rates) {
    return r.rates[0].fee[cls];
  }
  return r.plazas[i].fee[cls];
}

function compute(t){
  if (!t.inRoad || t.a === null || !t.outRoad || t.b === null) return {nodes:[], segs:[], total:0, error:''};
  const nodes = findRoute(key(t.inRoad, t.a), key(t.outRoad, t.b));
  if (!nodes) return {nodes:[], segs:[], total:0, error:'ไม่พบเส้นทางเชื่อม'};
  const raw = [];
  nodes.forEach(n => {
    const last = raw[raw.length - 1];
    if (last && last.road === n.road) last.idx.push(n.i);
    else raw.push({road:n.road, idx:[n.i]});
  });
  const segs = raw.filter(s => s.idx.length >= 2);
  const paid = new Set();
  let total = 0;
  let totalKm = 0;
  segs.forEach(s => {
    const r = getRoad(s.road);
    s.s = s.idx[0]; s.e = s.idx[s.idx.length - 1];
    if (r.type === 'flat') {
      if (r.group && paid.has(r.group)) s.fee = 0;
      else s.fee = flatFee(r, s.s);
      if (r.group) paid.add(r.group);
    } else if (r.type === 'barrier') {
      const passed = s.idx.filter(i => r.plazas[i].fee);
      s.fee = passed.reduce((f, i) => f + r.plazas[i].fee[cls], 0);
    } else {
      s.fee = r.calc(s.s, s.e, cls, r);
    }
    total += s.fee;
  });

  for(let i=1; i<nodes.length; i++) {
    const p1 = getRoad(nodes[i-1].road).plazas[nodes[i-1].i].ll;
    const p2 = getRoad(nodes[i].road).plazas[nodes[i].i].ll;
    totalKm += kmBetween(p1, p2);
  }
  const estMinutes = Math.round((totalKm / 80) * 60);

  return {nodes, segs, total, km: Math.round(totalKm), time: estMinutes, error: ''};
}

  opacity: 0.65
});
let isTrafficOn = false;

function toggleTrafficLayer() {
  isTrafficOn = !isTrafficOn;
  const btn = $('trafficToggleBtn');
  if(isTrafficOn) {
    trafficLayer.addTo(map);
    btn.classList.add('active');
  } else {

    btn.classList.remove('active');
  }

let sel = {inRoad:null, a:null, outRoad:null, b:null};
let trips = [];
let focusedTripIndex = null;
let selectedRoadId = null;

function updateMapInfoCard(title, sub, badgeText){
  if($('mapInfoTitle')) $('mapInfoTitle').textContent = title;
  if($('mapInfoSub')) $('mapInfoSub').textContent = sub;
  if($('mapInfoBadge')) $('mapInfoBadge').textContent = badgeText;
}

function drawMap(fitBounds = false){
  mapLayer.clearLayers();

  const activeKeys = new Set();
  const currentRes = compute(sel);
  if(currentRes.nodes.length) {
    currentRes.nodes.forEach(n => activeKeys.add(key(n.road, n.i)));
  }
  
  if(focusedTripIndex !== null && trips[focusedTripIndex]) {
    const res = compute(trips[focusedTripIndex]);
    if(res.nodes.length) {
      res.nodes.forEach(n => activeKeys.add(key(n.road, n.i)));
    }
  }

  const hasActive = activeKeys.size > 0;
  const allPts = [];

  ROADS.forEach(r => {
    const isSelectedRoad = (selectedRoadId === r.id);
    const lineWeight = isSelectedRoad ? 6 : 3.5;
    const lineOpacity = isSelectedRoad ? 0.95 : (hasActive ? 0.12 : 0.4);

    (r.paths || [r.plazas.map((_, i) => i)]).forEach(p => {
      const latlngs = p.map(i => r.plazas[i].ll);
      const polyline = L.polyline(latlngs, {color:r.color, weight:lineWeight, opacity:lineOpacity});
      
      polyline.on('click', () => {
        selectedRoadId = r.id;
        drawMap(false);
      });
      polyline.addTo(mapLayer);
    });

    r.plazas.forEach((p, i) => {
      const kStr = key(r.id, i);
      const isActive = activeKeys.has(kStr);
      const showLabel = (hasActive && isActive) || isSelectedRoad;
      const markerOpacity = hasActive ? (isActive ? 1.0 : 0.15) : (isSelectedRoad ? 1.0 : 0.8);
      const markerRadius = isActive || isSelectedRoad ? 7 : 4.5;

      if(isActive || isSelectedRoad) allPts.push(p.ll);

      const marker = L.circleMarker(p.ll, {radius: markerRadius, color:'#18181b', weight:2, fillColor:r.color, fillOpacity: markerOpacity})
        .addTo(mapLayer);

      const displayName = p.name.split(' / ')[currentLang === 'th' ? 0 : 1] || p.name;

      if(showLabel) {
        marker.bindTooltip(`<b>${displayName}</b>`, {permanent:true, direction:'top', offset:[0,-6], className:'map-plaza-label'});
      }
      
      marker.bindPopup(`
        <div style="font-family:'Prompt',sans-serif;text-align:center;min-width:140px;">
          <b style="font-size:.9rem;color:#ffb703;">${displayName}</b><br>
          <small style="color:#a1a1aa">${r.name.split(' / ')[currentLang === 'th' ? 0 : 1]}</small>
          <div style="display:flex;gap:6px;margin-top:10px;">
            <button class="popup-btn-in" onclick="mapSelectPlaza('in','${r.id}',${i})">${currentLang === 'th' ? '🟢 ขาเข้า' : '🟢 Inbound'}</button>
            <button class="popup-btn-out" onclick="mapSelectPlaza('out','${r.id}',${i})">${currentLang === 'th' ? '🔴 ขาออก' : '🔴 Outbound'}</button>
          </div>
        </div>
      `);
    });
  });

  const targetsToDraw = [];
  if(currentRes.nodes.length) targetsToDraw.push({res: currentRes, type: 'current'});

  if(focusedTripIndex !== null && trips[focusedTripIndex]) {
    const res = compute(trips[focusedTripIndex]);
    if(res.nodes.length) targetsToDraw.push({res: res, type: 'trip', index: focusedTripIndex});
  }

  targetsToDraw.forEach(item => {
    const target = item.res;
    for (let k = 1; k < target.nodes.length; k++) {
      const u = target.nodes[k-1], v = target.nodes[k];
      const roadObj = getRoad(u.road) || getRoad(v.road);
      const segColor = roadObj ? roadObj.color : '#ffb703';
      
      const p1 = getRoad(u.road).plazas[u.i].ll;
      const p2 = getRoad(v.road).plazas[v.i].ll;
      allPts.push(p1, p2);
      
      L.polyline([p1, p2], {color: segColor, weight: 6.5, opacity: 0.95}).addTo(mapLayer);
    }
  });

  const dict = i18n[currentLang];
  if(focusedTripIndex !== null && trips[focusedTripIndex]){
    const t = trips[focusedTripIndex];
    const res = compute(t);
    const rIn = getRoad(t.inRoad), rOut = getRoad(t.outRoad);
    const roadsName = res.segs.map(s => getRoad(s.road).name.split(' / ')[currentLang === 'th' ? 0 : 1]).join(' → ');
    const pA = rIn.plazas[t.a].name.split(' / ')[currentLang === 'th' ? 0 : 1];
    const pB = rOut.plazas[t.b].name.split(' / ')[currentLang === 'th' ? 0 : 1];
    updateMapInfoCard(`${currentLang === 'th' ? 'ทริปที่' : 'Trip'} ${focusedTripIndex + 1}: ${roadsName}`, `${pA} ➔ ${pB}`, `${res.total} ฿`);
  } else if(currentRes.nodes.length){
    const rIn = getRoad(sel.inRoad), rOut = getRoad(sel.outRoad);
    const roadsName = currentRes.segs.map(s => getRoad(s.road).name.split(' / ')[currentLang === 'th' ? 0 : 1]).join(' → ');
    const pA = rIn.plazas[sel.a].name.split(' / ')[currentLang === 'th' ? 0 : 1];
    const pB = rOut.plazas[sel.b].name.split(' / ')[currentLang === 'th' ? 0 : 1];
    updateMapInfoCard(`${currentLang === 'th' ? 'กำลังเลือก' : 'Selected'}: ${roadsName}`, `${pA} ➔ ${pB}`, `${currentRes.total} ฿`);
  } else if(selectedRoadId){
    const r = getRoad(selectedRoadId);
    const rName = r.name.split(' / ')[currentLang === 'th' ? 0 : 1];
    const sampleRes = compute({inRoad: r.id, a: 0, outRoad: r.id, b: r.plazas.length - 1});
    updateMapInfoCard(rName, `${currentLang === 'th' ? 'ด่านทั้งหมด' : 'All Plazas'}: ${r.plazas.length} ${currentLang === 'th' ? 'ด่าน' : 'plazas'}`, `${sampleRes.total} ฿ (End-End)`);
  } else {
    updateMapInfoCard(dict.mapOverviewTitle, dict.mapOverviewSub, dict.mapBadgeAll);
  }

  if (fitBounds && allPts.length) {
    map.fitBounds(allPts, {padding:[60,60], maxZoom:12});
  }
}

  sel = {inRoad:null, a:null, outRoad:null, b:null};

  focusedTripIndex = null;
  selectedRoadId = null;
  renderSelector(false);
  updateHomeUI();

}

function swapRoute(){
  const tempInRoad = sel.inRoad;
  const tempA = sel.a;
  sel.inRoad = sel.outRoad;
  sel.a = sel.b;
  sel.outRoad = tempInRoad;
  sel.b = tempA;
  renderSelector(false);
}

  selectedRoadId = null;

  if(type === 'in') {
    sel.inRoad = roadId;
    sel.a = plazaIdx;
    if(!sel.outRoad) { sel.outRoad = roadId; sel.b = getRoad(roadId).plazas.length - 1; }
  } else {
    sel.outRoad = roadId;
    sel.b = plazaIdx;
    if(!sel.inRoad) { sel.inRoad = roadId; sel.a = 0; }
  }
  map.closePopup();
  renderSelector(false);
};

function onRoadChange(type, roadId){
  selectedRoadId = null;
  if(type === 'in') {
    sel.inRoad = roadId ? roadId : null;
    sel.a = roadId ? 0 : null;
    if(roadId && !sel.outRoad) { sel.outRoad = roadId; sel.b = getRoad(roadId).plazas.length - 1; }
  } else {
    sel.outRoad = roadId ? roadId : null;
    sel.b = roadId ? getRoad(roadId).plazas.length - 1 : null;
    if(roadId && !sel.inRoad) { sel.inRoad = roadId; sel.a = 0; }
  }
  
  updateSelectColor(type, roadId);
  renderSelector(false);
}

function onPlazaChange(type, indexStr){
  selectedRoadId = null;
  const idx = indexStr === "" ? null : +indexStr;
  if(type === 'in') sel.a = idx;
  else sel.b = idx;
  renderSelector(false);
}

function updateSelectColor(type, roadId) {
  const selEl = $(type === 'in' ? 'inRoadSelect' : 'outRoadSelect');
  if (selEl) {
    if (roadId) {
      const r = getRoad(roadId);
      if (r) {
        selEl.style.borderColor = r.color;
        selEl.style.color = r.color;
      }
    } else {
      selEl.style.borderColor = '#3f3f46';
      selEl.style.color = '#fff';
    }
  }
}

function populateDropdowns(){
  const inRoadSel = $('inRoadSelect');
  const outRoadSel = $('outRoadSelect');
  const dict = i18n[currentLang];
  
  const optionsHtml = `<option value="" style="color:#fff">${dict.selectRoadPlaceholder}</option>` + 
    ROADS.map(r => {
      const displayName = r.name.split(' / ')[currentLang === 'th' ? 0 : 1];
      return `<option value="${r.id}" style="color:${r.color}">${displayName}</option>`;
    }).join('');

  if(inRoadSel) inRoadSel.innerHTML = optionsHtml;
  if(outRoadSel) outRoadSel.innerHTML = optionsHtml;
}

function updatePlazaDropdowns(){
  const inPlazaSel = $('inPlazaSelect');
  const outPlazaSel = $('outPlazaSelect');
  const dict = i18n[currentLang];

  if(inPlazaSel) {
    if(sel.inRoad) {
      const r = getRoad(sel.inRoad);
      if(r) {
        inPlazaSel.innerHTML = `<option value="">-- ${currentLang === 'th' ? 'เลือกด่านเริ่มต้น' : 'Select Entry Plaza'} --</option>` + 
          r.plazas.map((p, i) => {
            const dName = p.name.split(' / ')[currentLang === 'th' ? 0 : 1];
            return `<option value="${i}">${dName}</option>`;
          }).join('');
        inPlazaSel.value = sel.a !== null ? sel.a : "";
      }
    } else {
      inPlazaSel.innerHTML = `<option value="">${dict.selectRoadFirst}</option>`;
    }
  }

  if(outPlazaSel) {
    if(sel.outRoad) {
      const r = getRoad(sel.outRoad);
      if(r) {
        outPlazaSel.innerHTML = `<option value="">-- ${currentLang === 'th' ? 'เลือกด่านปลายทาง' : 'Select Exit Plaza'} --</option>` + 
          r.plazas.map((p, i) => {
            const dName = p.name.split(' / ')[currentLang === 'th' ? 0 : 1];
            return `<option value="${i}">${dName}</option>`;
          }).join('');
        outPlazaSel.value = sel.b !== null ? sel.b : "";
      }
    } else {
      outPlazaSel.innerHTML = `<option value="">${dict.selectRoadFirst}</option>`;
    }
  }
}

function renderSelector(fit = false){
  if($('inRoadSelect')) $('inRoadSelect').value = sel.inRoad || "";
  if($('outRoadSelect')) $('outRoadSelect').value = sel.outRoad || "";
  
  updateSelectColor('in', sel.inRoad);
  updateSelectColor('out', sel.outRoad);
  updatePlazaDropdowns();

  const res = compute(sel);
  if(res.total > 0) {
    if($('barFee')) $('barFee').textContent = res.total + ' ฿';
    if($('barMeta')) $('barMeta').textContent = currentLang === 'th' ? `ระยะทาง ~${res.km} กม. · เวลา ~${res.time} นาที` : `Distance ~${res.km} km · Time ~${res.time} min`;
    if($('checkoutBar')) $('checkoutBar').style.display = 'flex';
  } else {
    if($('checkoutBar')) $('checkoutBar').style.display = 'none';
  }

  drawMap(fit);
}

function addTripAndGo(){
  const res = compute(sel);
  if(res.total <= 0) return;
  trips.push({...sel});
  sel = {inRoad:null, a:null, outRoad:null, b:null};
  focusedTripIndex = trips.length - 1;
  selectedRoadId = null;
  renderSelector(false);
  updateHomeUI();
  switchTab('map', document.querySelectorAll('.nav-item')[1]);
}

window.viewSpecificTrip = idx => {
  focusedTripIndex = idx;
  selectedRoadId = null;
  switchTab('map', document.querySelectorAll('.nav-item')[1]);
};

function updateHomeUI(){
  let totalAll = 0;
  trips.forEach(t => { totalAll += compute(t).total; });
  if($('homeTotalDisplay')) $('homeTotalDisplay').textContent = totalAll.toLocaleString() + ' ฿';
  const dict = i18n[currentLang];

  if(!$('homeTripsList')) return;

  if (!trips.length) {
    $('homeTripsList').innerHTML = `<div style="text-align:center;color:#71717a;padding:30px;font-size:.78rem;">${dict.noTrips}</div>`;
    return;
  }

  $('homeTripsList').innerHTML = trips.map((t, idx) => {
    const rIn = getRoad(t.inRoad), rOut = getRoad(t.outRoad), res = compute(t);
    const roads = res.segs.map(s => getRoad(s.road).name.split(' / ')[currentLang === 'th' ? 0 : 1]).join(' → ');
    const pA = rIn.plazas[t.a].name.split(' / ')[currentLang === 'th' ? 0 : 1];
    const pB = rOut.plazas[t.b].name.split(' / ')[currentLang === 'th' ? 0 : 1];
    return `<div style="background:#18181b;border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid #27272a;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
        <div>
          <div style="font-weight:600;font-size:.8rem;color:#fff;">${idx + 1}. ${roads}</div>
          <div style="font-size:.68rem;color:#a1a1aa;margin-top:2px;">📍 ${pA} ➔ ${pB} (~${res.km} กม.)</div>
        </div>
        <div style="text-align:right;">
          <b style="color:#ffb703;font-size:.9rem;">${res.total} ฿</b><br>
          <button onclick="removeTrip(${idx})" style="background:none;border:none;color:#ef4444;font-size:.65rem;cursor:pointer;margin-top:4px;">${dict.deleteItem}</button>
        </div>
      </div>
      <button onclick="viewSpecificTrip(${idx})" style="width:100%;background:#27272a;border:1px solid #3f3f46;color:#38bdf8;padding:6px;border-radius:10px;font-size:.7rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;">
        ${dict.viewTripMap}
      </button>
    </div>`;
  }).join('');
}

window.removeTrip = idx => { 
  if(focusedTripIndex === idx) focusedTripIndex = null;
  else if(focusedTripIndex > idx) focusedTripIndex--;
  trips.splice(idx, 1); 
  updateHomeUI(); 
  drawMap(false);
};

function copySummary(){
  const dict = i18n[currentLang];
  if(!trips.length) { alert(dict.noTripsAlert); return; }
  let text = currentLang === 'th' ? '🛣️ สรุปค่าผ่านทางพิเศษ:\n' : '🛣️ Expressway Toll Summary:\n';
  let total = 0;
  trips.forEach((t, idx) => {
    const rIn = getRoad(t.inRoad), rOut = getRoad(t.outRoad), res = compute(t);
    total += res.total;
    const roads = res.segs.map(s => getRoad(s.road).name.split(' / ')[currentLang === 'th' ? 0 : 1]).join(' → ');
    const pA = rIn.plazas[t.a].name.split(' / ')[currentLang === 'th' ? 0 : 1];
    const pB = rOut.plazas[t.b].name.split(' / ')[currentLang === 'th' ? 0 : 1];
    text += `${idx+1}. ${roads} (${pA} -> ${pB}) = ${res.total} ${currentLang === 'th' ? 'บาท' : 'THB'}\n`;
  });
  text += currentLang === 'th' ? `💰 รวมทั้งสิ้น: ${total.toLocaleString()} บาท` : `💰 Grand Total: ${total.toLocaleString()} THB`;
  navigator.clipboard.writeText(text).then(() => alert(dict.copiedAlert));
}

document.querySelectorAll('#vehicles button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#vehicles button').forEach(b => {
      b.style.borderColor = '#3f3f46'; b.style.background = '#27272a'; b.style.color = '#a1a1aa'; b.style.fontWeight = '600';
    });
    btn.style.borderColor = '#ffb703'; btn.style.background = 'rgba(255,183,3,.15)'; btn.style.color = '#ffb703'; btn.style.fontWeight = '700';
    cls = +btn.dataset.c;
    renderSelector(false);
  };
});

populateDropdowns();
renderSelector(true);
updateHomeUI();
drawMap(true);
initAffiliateOnce();
</script>
</body>
</html>
